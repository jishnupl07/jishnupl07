name: Update Profile README

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dynamic sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: jishnupl07
        run: |
          python <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse

          username = os.environ["USERNAME"]

          def gh_api(endpoint):
              result = subprocess.run(
                  ["gh", "api", endpoint, "--paginate"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return json.loads(result.stdout)

          # Public, non-fork repositories ordered by stars, then recent activity.
          repos = gh_api(
              f"/users/{username}/repos?type=owner&per_page=100&sort=updated"
          )
          repos = [
              r for r in repos
              if not r["fork"] and r["name"] != username and not r["archived"]
          ]
          repos.sort(
              key=lambda r: (
                  r.get("stargazers_count", 0),
                  r.get("forks_count", 0),
                  r.get("updated_at", ""),
              ),
              reverse=True,
          )

          top_repos = repos[:6]

          cards = []
          for r in top_repos:
              name = r["name"]
              url = r["html_url"]
              description = (r.get("description") or "No description provided.").replace("\n", " ")
              if len(description) > 130:
                  description = description[:127] + "..."

              language = r.get("language") or "Code"
              stars = r.get("stargazers_count", 0)
              forks = r.get("forks_count", 0)

              cards.append(
                  f'''<a href="{url}">
            <img src="https://github-readme-stats.vercel.app/api/pin/?username={username}&repo={urllib.parse.quote(name)}&theme=github_dark&hide_border=true" alt="{name}"/>
          </a>'''
              )

          repo_section = "\n".join(cards) if cards else "<p>No public repositories found.</p>"

          # Collect languages from the current public repositories.
          language_totals = {}
          for r in repos:
              try:
                  languages = gh_api(r["languages_url"].replace(
                      "https://api.github.com/repos/" + username + "/" + r["name"],
                      ""
                  ))
              except Exception:
                  continue
              for lang, amount in languages.items():
                  language_totals[lang] = language_totals.get(lang, 0) + amount

          # Normalize language names to skillicons.dev identifiers.
          aliases = {
              "JavaScript": "javascript",
              "TypeScript": "typescript",
              "HTML": "html",
              "CSS": "css",
              "Python": "python",
              "Java": "java",
              "C": "c",
              "C++": "cpp",
              "C#": "cs",
              "Go": "go",
              "Rust": "rust",
              "PHP": "php",
              "Ruby": "ruby",
              "Kotlin": "kotlin",
              "Swift": "swift",
              "Dart": "dart",
              "Shell": "bash",
          }

          languages = [
              aliases[name]
              for name, _ in sorted(language_totals.items(), key=lambda x: x[1], reverse=True)
              if name in aliases
          ][:12]

          if not languages:
              languages = ["python", "html", "css", "javascript", "typescript", "java"]

          stack = (
              '<p align="center">\n'
              f'  <img src="https://skillicons.dev/icons?i={",".join(languages)}&perline=6" alt="Tech Stack"/>\n'
              '</p>'
          )

          path = "README.md"
          text = open(path, encoding="utf-8").read()

          def replace_section(text, start, end, replacement):
              a = text.index(start) + len(start)
              b = text.index(end, a)
              return text[:a] + "\n" + replacement + "\n" + text[b:]

          text = replace_section(
              text,
              "<!-- STACK:START -->",
              "<!-- STACK:END -->",
              stack,
          )
          text = replace_section(
              text,
              "<!-- REPOS:START -->",
              "<!-- REPOS:END -->",
              '<div align="center">\n\n' + repo_section + "\n\n</div>",
          )

          open(path, "w", encoding="utf-8").write(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update profile README"
          git push
